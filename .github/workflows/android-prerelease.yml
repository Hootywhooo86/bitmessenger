name: Android pre-release

# Builds the bitmessenger APK, runs the unit tests, and publishes it as a GitHub *pre-release*.
on:
  push:
    branches: [main, "claude/**", "ccr-*"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android-prerelease.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          echo "BITMESSENGER_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "BITMESSENGER_VERSION_NAME=0.1.${{ github.run_number }}-pre" >> "$GITHUB_ENV"

      # Sign with the 128bit family key (the same secrets bitcall uses). Same key = installs as
      # updates, and Bitter may borrow bitcall's on-device AI. Without the secrets: debug-signed artifact only.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.BITCALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/family.jks"
            echo "BITCALL_KEYSTORE_PATH=$RUNNER_TEMP/family.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; building a debug-signed artifact only (no pre-release published)."
          fi

      - name: Test and build
        env:
          BITCALL_KEYSTORE_PASSWORD: ${{ secrets.BITCALL_KEYSTORE_PASSWORD }}
          BITCALL_KEY_ALIAS: ${{ secrets.BITCALL_KEY_ALIAS }}
          BITCALL_KEY_PASSWORD: ${{ secrets.BITCALL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "bitmessenger-$BITMESSENGER_VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bitmessenger-apk
          path: android/bitmessenger-*.apk

      - name: Publish pre-release
        if: env.BITCALL_KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.{0}-pre', github.run_number) }}
          name: bitmessenger ${{ env.BITMESSENGER_VERSION_NAME }} (pre-release)
          prerelease: true
          files: android/bitmessenger-*.apk
          body: |
            Pre-release build for testing. Install the APK on an Android 11+ phone, open bitmessenger,
            and allow SMS access. Tap SET UP to make it your texting app (picture/group MMS can't be
            received yet). Signed with the 128bit family key, the same as Bitcall.
